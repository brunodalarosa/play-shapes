[preset.0]

name="Runtime Asset Validation Pack"
platform="Windows Desktop"
runnable=false
advanced_options_enabled=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="web/public/*.html,web/public/*.webmanifest,web/public/*.css,web/public/*.js,web/public/platform_input_settings.json,assets/runtime/animated_characters/squircle/v1/manifest.json"
exclude_filter="local/**,*.local.json,*.pem,*.key,*.crt,*.cer,*.der,*.p12,*.pfx,art/**,tools/**,tests/**,minigames/*/tests/**,test-results/**,web/node_modules/**,web/src/**,web/tests/**"
export_path=""
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
texture_format/etc2_astc.mobile=false

[preset.1]

name="Play Shapes Windows Release"
platform="Windows Desktop"
runnable=true
advanced_options_enabled=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="web/public/*.html,web/public/*.webmanifest,web/public/*.css,web/public/*.js,web/public/platform_input_settings.json,assets/runtime/animated_characters/squircle/v1/manifest.json"
exclude_filter="addons/godot_mcp/**,addons/standalone_build/**,local/**,*.local.json,*.pem,*.key,*.crt,*.cer,*.der,*.p12,*.pfx,art/**,builds/**,opencode.json,tools/**,tests/**,minigames/*/tests/**,test-results/**,web/package.json,web/package-lock.json,web/tsconfig.json,web/node_modules/**,web/src/**,web/tests/**"
