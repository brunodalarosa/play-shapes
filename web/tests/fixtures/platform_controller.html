<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Platform controller review</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .review { position: relative; z-index: 1000; max-width: 440px; margin: auto; padding: 18px; color: #244b3e; }
    .review h1 { font-size: 21px; margin: 0 0 8px; }
    .review p { font-size: 13px; margin: 0 0 10px; }
    #record { padding: 12px; background: #fff9df; border-radius: 16px; white-space: pre-wrap; font-size: 12px; max-block-size: 190px; overflow: auto; }
    .review summary { font-weight: 700; cursor: pointer; }
    .review form { gap: 6px; margin: 8px 0; }
    .review label { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    .review input { inline-size: 85px; min-block-size: 34px; font-size: 14px; color: #244b3e; background: #fff9df; padding: 4px; }
    .review button { min-block-size: 36px; margin-block: 4px; border: 2px solid #548c79; background: #fff9df; color: #244b3e; }
  </style>
</head>
<body>
  <section id="lobby-controller" hidden>
    <div id="lobby-stick-zone" role="group" aria-label="Movement and stance joystick"></div>
    <button id="lobby-jump-button" type="button" aria-label="Jump">JUMP</button>
  </section>
  <aside class="review">
    <h1>Platform controller review</h1>
    <p>Preview adapter: shared controls and intent, without host physics. X right; Y up. Hold the stick down to select FALL.</p>
    <pre id="record" aria-label="Recorded controller intent">No input</pre>
    <button id="switch" type="button">Switch adapter</button>
    <button id="reset" type="button">Reactivate controls</button>
    <details>
      <summary>Input tuning</summary>
      <form id="tuning">
        <label>Dead zone <input name="deadZone" type="number" step="0.01" min="0" max="0.9" required></label>
        <label>Radial hysteresis <input name="deadZoneHysteresis" type="number" step="0.01" min="0" max="0.9" required></label>
        <label>Vertical entry degrees <input name="verticalEnterDegrees" type="number" step="1" min="0" max="44" required></label>
        <label>Vertical exit degrees <input name="verticalExitDegrees" type="number" step="1" min="0" max="44" required></label>
        <button type="submit">Apply and reset</button>
      </form>
    </details>
  </aside>
  <script type="module" src="/platform_controller_review.mjs"></script>
</body>
</html>
