<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Play Shapes</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <p class="brand">PLAY SHAPES</p>
    <div class="shapes" aria-hidden="true">● ▲ ■</div>
    <h1>Join the game</h1>
    <p>Your phone is your Play Shapes controller.</p>
    <p id="status" class="status" role="status" aria-live="polite">Connecting to the host…</p>
    <form id="join-form" hidden>
      <label for="player-name">Your name</label>
      <input id="player-name" name="player-name" type="text" maxlength="16" autocomplete="nickname" required>
      <button id="join-button" type="submit">Join game</button>
    </form>
    <section id="player-card" aria-labelledby="player-name-heading" hidden>
      <p class="eyebrow">Joined as</p>
      <h2 id="player-name-heading"></h2>
      <p id="player-state">Connected</p>
      <button id="leave-button" class="secondary" type="button">Leave / Change player</button>
    </section>
    <section id="game-card" aria-labelledby="game-heading" hidden>
      <p class="eyebrow">Flash? Pose!</p>
      <h2 id="game-heading">Watch the big screen</h2>
      <p id="game-message">Get ready to pose when the music stops.</p>
      <p id="lives" class="lives" aria-live="polite"></p>
      <div id="pose-grid" class="pose-grid" aria-label="Pose controls"></div>
      <div id="rotate-state" class="rotate-state" role="status" hidden>Rotate your phone</div>
    </section>
    <noscript>Enable JavaScript to connect to the game.</noscript>
    <p class="footnote">Keep this page open while you play.</p>
  </main>
</body>
</html>
